services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: chat-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  user:
    build:
      context: ./backend/user
    env_file:
      - ./backend/user/.env
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "5000:5000"

  chat:
    build:
      context: ./backend/chat
    env_file:
      - ./backend/chat/.env
    environment:
      USER_SERVICE: http://user:5000
      CLIENT_URL: http://localhost:3000
    depends_on:
      rabbitmq:
        condition: service_healthy
      user:
        condition: service_started
    ports:
      - "5002:5002"

  mail:
    build:
      context: ./backend/mail
    env_file:
      - ./backend/mail/.env
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "5001:5001"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_USER_SERVICE_URL: http://localhost:5000
        NEXT_PUBLIC_CHAT_SERVICE_URL: http://localhost:5002
    environment:
      NEXT_PUBLIC_USER_SERVICE_URL: http://localhost:5000
      NEXT_PUBLIC_CHAT_SERVICE_URL: http://localhost:5002
    depends_on:
      - user
      - chat
    ports:
      - "3000:3000"

volumes:
  rabbitmq-data:
